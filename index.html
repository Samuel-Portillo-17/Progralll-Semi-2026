<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de impuestos a las actividades economicas</title>
    <!-- CSS -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css"/>
    <!-- Default theme -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/default.min.css"/>
    <!-- Semantic UI theme -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/semantic.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <script>
        // Validación de seguridad: si no ha iniciado sesión, se redirige al login
        if (!localStorage.getItem("usuarioLogueado")) {
            window.location.href = "/login.html";
        }
    </script>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">::.. SISTEMA DE IMPUESTOS A LAS ACTIVIDADES ECONOMICAS ..::</a>
            <div class="collapse navbar-collapse" id="mnxImpuestos">
                <div class="navbar-nav me-auto">
                    <a class="nav-link" href="#" data-form="clientes">Clientes</a>
                    <a class="nav-link" href="#" data-form="productos">Productos</a>
                    <a class="nav-link" href="#" data-form="usuarios">Usuarios</a>
                </div>
                <div class="d-flex">
                    <button class="btn btn-outline-danger btn-sm" id="btnCerrarSesion">Cerrar Sesión</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid position-relative mt-3">
        <div class="position-absolute" id="clientes"></div>
        <div class="position-absolute" id="busqueda_clientes"></div>
        <div class="position-absolute" id="productos"></div>
        <div class="position-absolute" id="busqueda_productos"></div>
        <div class="position-absolute" id="usuarios"></div>
        <div class="position-absolute" id="busqueda_usuarios"></div>
    </div>

    <!-- JavaScript -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.14.2/jquery-ui.js" integrity="sha512-nF9ZY+o4GTMKGuKfrwYSdqrbG59QLhdJgtXOPiRZ4CkswwdjyTaPn0qvbRoIsih0ZbEKfCN9dU7lhqkIQUdY/A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", events => {
            const mnxImpuestos = document.getElementById('mnxImpuestos');
            mnxImpuestos.addEventListener('click', e => {
                if(e.target.dataset.form) {
                    e.preventDefault();
                    let form = e.target.dataset.form;
                    cargarForm(form);
                }
            });

            // Botón para salir de la sesión
            document.getElementById("btnCerrarSesion").addEventListener("click", () => {
                localStorage.removeItem("usuarioLogueado");
                window.location.href = "/login.html";
            });
        });

        function cargarForm(form, callback){
            if( $(`#${form} > form`).length <= 0 ){
                fetch(`/vistas?form=${form}`)
                .then(response => response.text())
                .then(ventana => {
                    $(`#${form}`).html(ventana).draggable();
                    cerrarVentana();
                    if(callback) callback();
                })
                .catch(error => console.error('Error al cargar el formulario:', error));
            }else{
                $(`#${form}`).show();
            }
        }

        function cerrarVentana(){
            $('.btn-close').off('click').on('click', e => {
                e.preventDefault();
                let form = e.target.dataset.form;
                $(`#${form}`).hide();
            });
        }
    </script>
</body>
</html>
