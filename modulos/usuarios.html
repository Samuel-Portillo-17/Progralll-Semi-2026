<form id="formUsuarios" class="p-4 bg-white border rounded shadow" style="width: 450px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5>Gestión de Usuarios</h5>
        <button type="button" class="btn-close" data-form="usuarios" aria-label="Close"></button>
    </div>

    <input type="hidden" id="IdUsuario" name="IdUsuario">
    <input type="hidden" id="accion" name="accion" value="nuevo">

    <div class="mb-2">
        <label class="form-label">Usuario:</label>
        <input type="text" class="form-control" id="Usuario" name="Usuario" required>
    </div>

    <div class="mb-2">
        <label class="form-label">Clave:</label>
        <input type="password" class="form-control" id="clave" name="clave" required>
    </div>

    <div class="mb-2">
        <label class="form-label">Nombre:</label>
        <input type="text" class="form-control" id="nombre" name="nombre" required>
    </div>

    <div class="mb-2">
        <label class="form-label">Dirección:</label>
        <input type="text" class="form-control" id="direccion" name="direccion" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Teléfono:</label>
        <input type="text" class="form-control" id="telefono" name="telefono" maxlength="9" required>
    </div>

    <div class="d-flex justify-content-between">
        <button type="submit" class="btn btn-success" id="btnGuardar">Guardar</button>
        <button type="button" class="btn btn-warning" id="btnModificar">Modificar</button>
        <button type="button" class="btn btn-danger" id="btnEliminar">Eliminar</button>
    </div>

    <hr>
    
    <div class="mb-2">
        <label class="form-label">Buscar Usuario:</label>
        <input type="text" class="form-control" id="txtBuscar" placeholder="Escriba para buscar...">
    </div>
    
    <div style="max-height: 150px; overflow-y: auto;">
        <table class="table table-sm table-striped" id="tablaUsuarios">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Usuario</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</form>

<script>
    $(document).ready(function() {
        // Cargar lista inicial o búsqueda
        function buscarUsuarios(filtro = '') {
            $.get('/usuarios?buscar=' + filtro, function(data) {
                let filas = '';
                if(data) {
                    data.forEach(u => {
                        filas += `<tr data-id='${JSON.stringify(u)}' style="cursor:pointer;">
                            <td>${u.nombre}</td>
                            <td>${u.Usuario}</td>
                        </tr>`;
                    });
                }
                $('#tablaUsuarios tbody').html(filas);
            });
        }

        buscarUsuarios();

        $('#txtBuscar').on('keyup', function() {
            buscarUsuarios($(this).val());
        });

        // Seleccionar de la tabla para editar/eliminar
        $(document).on('click', '#tablaUsuarios tr', function() {
            let u = JSON.parse($(this).attr('data-id'));$('#IdUsuario').val(u.IdUsuario);
            $('#Usuario').val(u.Usuario);
            $('#clave').val(u.clave);
            $('#nombre').val(u.nombre);
            $('#direccion').val(u.direccion);
            $('#telefono').val(u.telefono);
            $('#accion').val('modificar');
        });

        // Enviar datos al servidor (CRUD)
        $('#formUsuarios').on('submit', function(e) {
            e.preventDefault();
            let datos = {
                modulo: 'usuario',
                accion: $('#accion').val(),
                IdUsuario: $('#IdUsuario').val(),
                Usuario: $('#Usuario').val(),
                clave: $('#clave').val(),
                nombre: $('#nombre').val(),
                direccion: $('#direccion').val(),
                telefono: $('#telefono').val()
            };

            $.ajax({
                url: '/',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(datos),
                success: function(response) {
                    alertify.success(response.msg);
                    buscarUsuarios();
                    $('#formUsuarios')[0].reset();
                    $('#accion').val('nuevo');
                }
            });
        });

        $('#btnModificar').click(function() {
            $('#accion').val('modificar');
            $('#formUsuarios').submit();
        });

        $('#btnEliminar').click(function() {
            if(confirm("¿Desea eliminar este usuario?")) {
                $('#accion').val('eliminar');
                $('#formUsuarios').submit();
            }
        });
    });
</script>
